{% set name = "scikit-misc" %}
{% set version = "0.5.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/has2k1/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 891f676b56992fcdd21f5c9c5c956d8226a1ff484e262be673535f262d823d8a

build:
  number: 0

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - meson-python                           # [build_platform != target_platform]
    - {{ compiler("c") }}
    - {{ stdlib("c") }}
    - {{ compiler("fortran") }}              # [not win]
    - flang_{{ target_platform }} >=22       # [win]
    - flang-rt_{{ target_platform }} >=22    # [win]
    - ninja
  host:
    - python
    - pip
    - cython
    - numpy
    - setuptools
    - meson-python
    - wheel
    - python-build
    - flang-rt_{{ target_platform }} >=22    # [win]
  run:
    - python
    - numpy
    - flang-rt_{{ target_platform }} >=22    # [win]

test:
  imports:
    - skmisc
    - skmisc.loess

about:
  home: https://github.com/has2k1/scikit-misc
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Miscellaneous tools for data analysis and scientific computing.
  doc_url: https://has2k1.github.io/scikit-misc
  dev_url: https://github.com/has2k1/scikit-misc

extra:
  recipe-maintainers:
    - has2k1
    - yihming
    - bli25
    - Wainberg
